name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v

      - name: Verify generated code is up to date
        run: go run ./cmd/gofast generate --check ./examples/minimal/main.go

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...